<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Troop 2360 Cookie Tracker</title>
<style>
:root{--bg:#fff8ee;--panel:rgba(255,255,255,.94);--ink:#2c2416;--sub:#6b5f4d;--line:#eadfcf;--brown:#7a4a2c;--green:#00834f;--accent:#f6b84a;--danger:#a53f3f;--radius:14px}
:root:not([data-theme="light"]){@media(prefers-color-scheme:dark){--bg:#1c1810;--panel:#262019;--ink:#f0ead9;--sub:#b8ac93;--line:#3a3226;--brown:#c98a5e;--green:#5fae82;--accent:#e0a752}}
:root[data-theme="dark"]{--bg:#1c1810;--panel:#262019;--ink:#f0ead9;--sub:#b8ac93;--line:#3a3226;--brown:#c98a5e;--green:#5fae82;--accent:#e0a752}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(circle at 12% 18%,rgba(92,192,113,.30) 0 90px,transparent 92px),radial-gradient(circle at 88% 12%,rgba(246,184,74,.32) 0 120px,transparent 122px),radial-gradient(circle at 82% 78%,rgba(131,96,179,.22) 0 145px,transparent 147px),radial-gradient(circle at 14% 84%,rgba(228,98,106,.20) 0 125px,transparent 127px),linear-gradient(135deg,#fff6d9 0%,#ecfaef 48%,#fff0f3 100%);background-attachment:fixed;color:var(--ink);font-family:Georgia,'Iowan Old Style',serif;line-height:1.4;min-height:100vh}
header{background:linear-gradient(110deg,#00834f 0%,#00a56a 55%,#6f3f8f 100%);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;box-shadow:0 3px 12px rgba(44,36,22,.18)}
header h1{margin:0;font-size:1.25rem;font-weight:600}
header .sub{font-family:Verdana,sans-serif;font-size:.75rem;opacity:.85}
#coordBtn,#girlBtn{font-family:Verdana,sans-serif;font-size:.8rem;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer}
#coordBtn.on{background:var(--accent);border-color:var(--accent);color:#2c2416}
.header-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
#girlBtn.on{background:#fff;color:#17613f;border-color:#fff}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:9px 12px;background:rgba(255,255,255,.91);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
nav button{font-family:Verdana,sans-serif;font-size:.8rem;font-weight:700;padding:8px 13px;border:1px solid #b8cbbf;background:#eef8f1;color:#175f3d;border-radius:20px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
nav button:hover{background:#dff2e5;border-color:#78a98b}
nav button.active{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 2px 7px rgba(0,131,79,.28)}
main{max-width:920px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.82);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 5px 18px rgba(73,54,28,.10)}
h2{margin-top:0;font-size:1.05rem}
table{width:100%;border-collapse:collapse;font-family:Verdana,sans-serif;font-size:.82rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:600}
tr:last-child td{border-bottom:none}
.tot{font-weight:700}
label{display:block;font-family:Verdana,sans-serif;font-size:.75rem;color:var(--sub);margin:8px 0 3px}
input,select,textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-family:Verdana,sans-serif;font-size:.85rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font-family:Verdana,sans-serif;font-size:.82rem;padding:8px 14px;border:none;border-radius:7px;background:var(--green);color:#fff;cursor:pointer;margin-top:10px}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger)}
.badge{display:inline-block;font-family:Verdana,sans-serif;font-size:.7rem;background:var(--accent);color:#2c2416;padding:2px 7px;border-radius:10px;margin-left:6px}
.chk{display:flex;align-items:center;gap:6px;font-family:Verdana,sans-serif;font-size:.8rem;margin:4px 0}
.chk input{width:auto}
.muted{color:var(--sub);font-family:Verdana,sans-serif;font-size:.78rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20}
.modal{background:var(--panel);padding:20px;border-radius:12px;max-width:320px;width:90%}
.row-actions button{font-size:.72rem;padding:3px 8px;margin-right:4px}
.small{font-size:.75rem;color:var(--sub)}
::placeholder{color:var(--sub);opacity:.6}
#status{font-family:Verdana,sans-serif;font-size:.7rem;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.15)}
#status.live{background:#3a7a52}
#status.err{background:var(--danger)}
</style>
</head>
<body>
<header>
  <div><h1>🍪 Troop 2360 Cookie Tracker</h1><div class="sub">2026 Cookie Season <span id="status">Connecting…</span></div></div>
  <div class="header-actions"><button id="girlBtn" onclick="toggleGirlLogin()">Family sign in</button><button id="coordBtn" onclick="toggleCoord()">Coordinator: Locked</button></div>
</header>
<nav id="tabs"></nav>
<main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ====== PASTE YOUR FIREBASE CONFIG HERE (see setup instructions) ====== */
const firebaseConfig = {
  apiKey: "AIzaSyDQ0ZGWjHcUZgMWaS47AKLrCywXCDWHTqM",
  authDomain: "troop-2360-cookies.firebaseapp.com",
  projectId: "troop-2360-cookies",
  storageBucket: "troop-2360-cookies.firebasestorage.app",
  messagingSenderId: "189199563563",
  appId: "1:189199563563:web:a6414a9e527726345aa36e",
  measurementId: "G-BW10NGSLQQ"
};
/* ======================================================================= */

const COOKIES=[
 {key:'adv',name:'Adventurefuls',price:6},{key:'exp',name:'Exploremores',price:6},
 {key:'lem',name:'Lemonades',price:6},{key:'tre',name:'Trefoils',price:6},
 {key:'tm',name:'Thin Mints',price:6},{key:'pbp',name:'Peanut Butter Patties',price:6},
 {key:'cdl',name:'Caramel deLites',price:6},{key:'pbs',name:'Peanut Butter Sandwich',price:6},
 {key:'gf',name:'Caramel Chocolate Chip (GF)',price:7},
 {key:'spk',name:'Sparkables',price:6},{key:'pp',name:'PatchPals',price:6},
 {key:'share',name:'Cookie Share (Donation)',price:6}];
const GIRL_NAMES=['Amelia','Carissa','Cassie','Coco','Emersyn','Evelyn','Katherine','Keira','Madison','Morgan','Makenna','Molly','Sophia'];
function uid(){return Math.random().toString(36).slice(2,10)}
function defaultState(){
  let girls=GIRL_NAMES.map(n=>({id:uid(),name:n}));
  let girlInv={}; girls.forEach(g=>girlInv[g.id]={inv:{},paid:0});
  return {girls,cookies:COOKIES,troopInv:{},girlInv,girlPins:{},transfers:[],transferRequests:[],inventoryReceipts:[],payments:[],booths:[],online:[],pw:'cookies2026'};
}
let state=null, coord=false, girlUserId=sessionStorage.getItem('girlUserId')||null, db=null, docRef=null, ready=false;
function setStatus(cls,text){const el=document.getElementById('status'); el.className=cls; el.textContent=text;}
function save(){
  if(!docRef)return;
  docRef.set(state).then(()=>setStatus('live','Live')).catch(e=>{setStatus('err','Not saved — check connection'); console.error(e);});
}
function startApp(){
  if(firebaseConfig.apiKey==='YOUR_API_KEY'){
    document.getElementById('app').innerHTML=`<div class="card"><h2>Almost there</h2><p>This copy of the tracker needs a free Firebase project connected before it can sync. Open the file's code and paste your <code>firebaseConfig</code> values in near the top where it says "PASTE YOUR FIREBASE CONFIG HERE".</p></div>`;
    setStatus('err','Not connected');
    return;
  }
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="${activeTab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  document.getElementById('app').innerHTML='<div class="card">Connecting to the shared troop database…</div>';
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();
  docRef=db.collection('troop2360').doc('data');
  docRef.onSnapshot(snap=>{
    if(snap.exists){state=Object.assign(defaultState(),snap.data()); if(!state.cookies||!state.cookies.length)state.cookies=COOKIES;}
    else{state=defaultState(); docRef.set(state);}
    if(girlUserId&&!state.girls.some(g=>g.id===girlUserId)){girlUserId=null;sessionStorage.removeItem('girlUserId');}
    ready=true; setStatus('live','Live'); render();
  },err=>{setStatus('err','Connection error — check your Firebase config & rules'); console.error(err);});
}
function zeroMap(){let m={}; state.cookies.forEach(c=>m[c.key]=0); return m}
function invOf(obj){return Object.assign(zeroMap(),obj||{})}
function money(n){return '$'+(Math.round(n*100)/100).toFixed(2)}
function girlName(id){if(id==='TROOP')return 'Troop';let g=state.girls.find(x=>x.id===id);return g?g.name:'(removed)'}

function toggleCoord(){
  if(coord){coord=false;render();return}
  let p=prompt('Coordinator password:');
  if(p===null)return;
  if(p===state.pw){coord=true;render();}
  else alert('Incorrect password.');
}

function toggleGirlLogin(){
  if(girlUserId){girlUserId=null;sessionStorage.removeItem('girlUserId');render();return}
  const opts=state.girls.map(g=>`<option value="${g.id}">${g.name}</option>`).join('');
  document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="girlLogin"><div class="modal"><h2>Family sign in</h2><label>Girl Scout</label><select id="loginGirl">${opts}</select><label>PIN</label><input id="loginPin" type="password" inputmode="numeric" maxlength="8" placeholder="Enter PIN" onkeydown="if(event.key==='Enter')doGirlLogin()"><button class="btn" onclick="doGirlLogin()">Sign in</button> <button class="btn sec" onclick="closeGirlLogin()">Cancel</button><p class="muted">Ask the cookie coordinator if you need your PIN.</p></div></div>`);
  setTimeout(()=>document.getElementById('loginPin')?.focus(),0);
}
function closeGirlLogin(){document.getElementById('girlLogin')?.remove()}
function doGirlLogin(){
  const id=document.getElementById('loginGirl').value, pin=document.getElementById('loginPin').value.trim();
  if(!state.girlPins?.[id]){alert('A PIN has not been assigned yet. Ask the coordinator to create one.');return}
  if(pin!==String(state.girlPins[id])){alert('Incorrect PIN.');return}
  girlUserId=id;sessionStorage.setItem('girlUserId',id);closeGirlLogin();render();
}

const TABS=[['dash','Dashboard'],['mine','My Inventory'],['troop','Troop Inventory'],['transfers','Transfers'],['requests','Transfer Requests'],['payments','Payments'],['booths','Booth Sales'],['online','Online Sales'],['coord','Coordinator']];
let activeTab='dash', selectedGirlId=null, editingReceiptId=null;
function setTab(t){activeTab=t;render();}
function setMineGirl(id){selectedGirlId=id;render();}

function render(){
  if(!ready)return;
  document.getElementById('coordBtn').textContent='Coordinator: '+(coord?'Unlocked':'Locked');
  document.getElementById('coordBtn').className=coord?'on':'';
  const girlBtn=document.getElementById('girlBtn'), signedGirl=state.girls.find(g=>g.id===girlUserId);
  girlBtn.textContent=signedGirl?'Signed in: '+signedGirl.name:'Family sign in';
  girlBtn.className=signedGirl?'on':'';
  const nav=document.getElementById('tabs');
  nav.innerHTML=TABS.map(([k,l])=>`<button class="${activeTab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  document.getElementById('app').innerHTML=({dash:renderDash,mine:renderMine,troop:renderTroop,transfers:renderTransfers,requests:renderRequests,payments:renderPayments,booths:renderBooths,online:renderOnline,coord:renderCoord}[activeTab])();
}

function totalGirlInv(){let t=zeroMap(); state.girls.forEach(g=>{let inv=invOf(state.girlInv[g.id]?.inv);state.cookies.forEach(c=>t[c.key]+=inv[c.key]||0)}); return t}
function totalBoothsByType(){let t=zeroMap(); state.booths.forEach(b=>state.cookies.forEach(c=>t[c.key]+=b.sales[c.key]||0)); return t}
function totalOnlineByType(){let t=zeroMap(); state.online.forEach(o=>state.cookies.forEach(c=>t[c.key]+=o.items[c.key]||0)); return t}

function renderDash(){
  const girlInv=totalGirlInv(), booth=totalBoothsByType(), online=totalOnlineByType();
  const boothCash=state.booths.reduce((s,b)=>s+(+b.cash||0),0), boothDig=state.booths.reduce((s,b)=>s+(+b.digital||0),0), boothDon=state.booths.reduce((s,b)=>s+(+b.donations||0),0);
  const onlineAmt=state.online.reduce((s,o)=>s+(+o.amount||0),0);
  let rows=state.cookies.map(c=>{
    const troopQ=state.troopInv[c.key]||0, girlQ=girlInv[c.key]||0, boothQ=booth[c.key]||0, onlineQ=online[c.key]||0;
    return `<tr><td>${c.name}</td><td>${troopQ}</td><td>${girlQ}</td><td>${boothQ}</td><td>${onlineQ}</td></tr>`;
  }).join('');
  return `<div class="card"><h2>Troop overview</h2>
  <table><tr><th>Cookie</th><th>In troop cupboard</th><th>With girls</th><th>Sold at booths</th><th>Sold online</th></tr>${rows}</table>
  </div>
  <div class="card"><h2>Money raised so far</h2>
  <table><tr><td>Booth cash</td><td>${money(boothCash)}</td></tr><tr><td>Booth digital/card</td><td>${money(boothDig)}</td></tr><tr><td>Booth donations</td><td>${money(boothDon)}</td></tr><tr><td>Online sales</td><td>${money(onlineAmt)}</td></tr>
  <tr class="tot"><td>Total raised</td><td>${money(boothCash+boothDig+boothDon+onlineAmt)}</td></tr></table>
  <p class="muted">"With girls" is what's currently checked out to a Girl Scout and not yet sold or transferred back. Booth and online totals are lifetime boxes sold in each channel.</p>
  </div>`;
}

function renderMine(){
  if(!selectedGirlId||!state.girls.some(g=>g.id===selectedGirlId))selectedGirlId=state.girls[0]?.id||null;
  let opts=state.girls.map(g=>`<option value="${g.id}" ${g.id===selectedGirlId?'selected':''}>${g.name}</option>`).join('');
  return `<div class="card"><h2>My inventory</h2>
  <label>Pick your name</label><select id="mineSel" onchange="setMineGirl(this.value)">${opts}</select>
  ${mineDetail(selectedGirlId)}
  </div>`;
}
function mineDetail(gid){
  if(!gid)return '<p class="muted">Add girls on the Coordinator tab first.</p>';
  const g=state.girls.find(x=>x.id===gid); if(!g)return '';
  const rec=state.girlInv[gid]||{inv:{},paid:0}; const inv=invOf(rec.inv);
  const boxes=state.cookies.reduce((s,c)=>s+(inv[c.key]||0),0);
  const boothCount=state.booths.filter(b=>b.girls.includes(g.name)).length;
  const onlineBoxes=state.online.filter(o=>o.girlId===gid).reduce((s,o)=>s+state.cookies.reduce((x,c)=>x+(o.items[c.key]||0),0),0);
  const onlineAmt=state.online.filter(o=>o.girlId===gid).reduce((s,o)=>s+(+o.amount||0),0);
  const value=state.cookies.reduce((s,c)=>s+(inv[c.key]||0)*c.price,0);
  let rows=state.cookies.map(c=>`<tr><td>${c.name}</td><td>${inv[c.key]||0}</td></tr>`).join('');
  return `<h3 style="margin-bottom:2px">${g.name}</h3>
  <table><tr><th>Cookie</th><th>Boxes on hand</th></tr>${rows}<tr class="tot"><td>Total boxes on hand</td><td>${boxes} (${money(value)})</td></tr></table>
  <p class="muted">Worked ${boothCount} booth(s) &middot; ${onlineBoxes} boxes sold online (${money(onlineAmt)})${coord||girlUserId===gid?` &middot; Paid to troop: ${money(rec.paid||0)}`:''}</p>`;
}

function renderTroop(){
  let rows=state.cookies.map(c=>`<tr><td>${c.name}</td><td>${state.troopInv[c.key]||0}</td><td>${money(c.price)}</td></tr>`).join('');
  let editRows= coord? state.cookies.map(c=>`<div class="grid2"><label>${c.name} qty</label><input type="number" id="ti_${c.key}" value="${state.troopInv[c.key]||0}"></div>`).join('') :'';
  const editing=(state.inventoryReceipts||[]).find(r=>r.id===editingReceiptId)||null;
  let addRows=coord?state.cookies.map(c=>`<div class="grid2"><label>${c.name}</label><input type="number" min="0" class="receiptQty" data-key="${c.key}" value="${editing?.items?.[c.key]||''}" placeholder="0"></div>`).join(''):'';
  let receiptRows=[...(state.inventoryReceipts||[])].reverse().map(r=>`<tr><td>${r.date}</td><td>${r.source==='troop-transfer'?'Transfer from Troop '+(r.troopNumber||'—'):'Cupboard pickup'}</td><td>${state.cookies.map(c=>r.items[c.key]?`${c.name} ${r.items[c.key]}`:null).filter(Boolean).join(', ')||'—'}</td><td>${r.notes||''}</td><td class="row-actions">${coord?`<button class="btn sec" onclick="editInventoryReceipt('${r.id}')">Edit</button><button class="btn danger" onclick="delInventoryReceipt('${r.id}')">Delete</button>`:''}</td></tr>`).join('');
  return `<div class="card"><h2>Troop cupboard inventory</h2>
  <table><tr><th>Cookie</th><th>Boxes on hand</th><th>Price/box</th></tr>${rows}</table>
  <p class="muted">This is stock the troop is holding that hasn't been checked out to a Girl Scout yet (e.g. cupboard pickups, initial order).</p>
  ${coord?`<h3>${editing?'Edit inventory entry':'Add inventory'} <span class="badge">Coordinator</span></h3>
  <p class="muted">${editing?'Saving changes will adjust the cupboard totals by the difference.':'Use this for cupboard pickups or cookies received from another troop. The quantities will be added to the cupboard total.'}</p>
  <div class="grid2"><div><label>Date received</label><input type="date" id="rDate" value="${editing?.date||new Date().toISOString().slice(0,10)}"></div><div><label>Source</label><select id="rSource"><option value="cupboard" ${editing?.source==='cupboard'?'selected':''}>Cupboard pickup</option><option value="troop-transfer" ${editing?.source==='troop-transfer'?'selected':''}>Transfer from another troop</option></select></div></div>
  <label>Other troop number (for troop transfers)</label><input id="rTroop" value="${editing?.troopNumber||''}" placeholder="e.g. 1234">
  <h3>Boxes received by type</h3>${addRows}
  <label>Notes</label><input id="rNotes" value="${editing?.notes||''}" placeholder="e.g. Irvine cupboard pickup or transfer details">
  <button class="btn" onclick="addInventoryReceipt()">${editing?'Save entry changes':'Add to troop inventory'}</button>${editing?' <button class="btn sec" onclick="cancelReceiptEdit()">Cancel</button>':''}
  <details style="margin-top:18px"><summary class="small" style="cursor:pointer;font-weight:700">Correct cupboard totals manually</summary>${editRows}<button class="btn sec" onclick="saveTroopInv()">Save corrected totals</button></details>`:'<p class="small">Only coordinators can add or correct cupboard inventory.</p>'}
  </div>
  <div class="card"><h2>Inventory received history</h2><table><tr><th>Date</th><th>Source</th><th>Boxes received</th><th>Notes</th><th></th></tr>${receiptRows||'<tr><td colspan="5" class="muted">No cupboard pickups or incoming troop transfers recorded yet.</td></tr>'}</table></div>`;
}
function saveTroopInv(){
  state.cookies.forEach(c=>{state.troopInv[c.key]=+document.getElementById('ti_'+c.key).value||0});
  save(); render();
}

function addInventoryReceipt(){
  if(!coord)return;
  const date=document.getElementById('rDate').value, source=document.getElementById('rSource').value;
  const troopNumber=document.getElementById('rTroop').value.trim(), notes=document.getElementById('rNotes').value.trim(), items={};
  let total=0;
  document.querySelectorAll('.receiptQty').forEach(el=>{const q=+el.value||0;if(q>0){items[el.dataset.key]=q;total+=q;}});
  if(!date){alert('Choose the date the cookies were received.');return}
  if(source==='troop-transfer'&&!troopNumber){alert('Enter the troop number the cookies came from.');return}
  if(!total){alert('Enter at least one box received.');return}
  state.inventoryReceipts=state.inventoryReceipts||[];
  const existing=state.inventoryReceipts.find(r=>r.id===editingReceiptId);
  if(existing){
    state.cookies.forEach(c=>{state.troopInv[c.key]=(state.troopInv[c.key]||0)+(items[c.key]||0)-(existing.items?.[c.key]||0)});
    Object.assign(existing,{date,source,troopNumber,notes,items});editingReceiptId=null;
  }else{
    Object.entries(items).forEach(([k,q])=>{state.troopInv[k]=(state.troopInv[k]||0)+q});
    state.inventoryReceipts.push({id:uid(),date,source,troopNumber,notes,items});
  }
  save();render();
}

function editInventoryReceipt(id){if(!coord)return;editingReceiptId=id;render();window.scrollTo({top:0,behavior:'smooth'});}
function cancelReceiptEdit(){editingReceiptId=null;render();}

function delInventoryReceipt(id){
  if(!coord)return;
  const r=(state.inventoryReceipts||[]).find(x=>x.id===id);if(!r)return;
  if(!confirm('Delete this inventory receipt? Its boxes will be removed from troop inventory.'))return;
  Object.entries(r.items||{}).forEach(([k,q])=>{state.troopInv[k]=(state.troopInv[k]||0)-q});
  state.inventoryReceipts=state.inventoryReceipts.filter(x=>x.id!==id);
  if(editingReceiptId===id)editingReceiptId=null;
  save();render();
}

function renderTransfers(){
  const permittedGirls=state.girls;
  let entityOpts=(coord?'<option value="TROOP">Troop cupboard</option>':'')+permittedGirls.map(g=>`<option value="${g.id}">${g.name}</option>`).join('');
  let cookieOpts=state.cookies.map(c=>`<option value="${c.key}">${c.name}</option>`).join('');
  let list=[...state.transfers].reverse().map(t=>`<tr><td>${t.date}</td><td>${girlName(t.from)}&rarr;${girlName(t.to)}</td><td>${t.qty} ${state.cookies.find(c=>c.key===t.cookie)?.name||''}</td><td>${t.note||''}</td>
    <td class="row-actions">${coord||t.createdByGirlId===girlUserId?`<button class="btn danger" onclick="delTransfer('${t.id}')">Delete</button>`:''}</td></tr>`).join('');
  const form=coord||girlUserId?`<div class="card"><h2>Record a transfer</h2>
  <p class="muted">${coord?'Move boxes between the troop cupboard and any girl, or between two girls.':'Transfer between your Girl Scout and another girl. Transfers involving the troop cupboard require the coordinator.'}</p>
  <div class="grid2"><div><label>From</label><select id="tFrom">${entityOpts}</select></div><div><label>To</label><select id="tTo">${entityOpts}</select></div></div>
  <div class="grid2"><div><label>Cookie</label><select id="tCookie">${cookieOpts}</select></div><div><label>Boxes</label><input type="number" id="tQty" min="0"></div></div>
  <label>Date</label><input type="date" id="tDate" value="${new Date().toISOString().slice(0,10)}">
  <label>Note (optional)</label><input id="tNote" placeholder="e.g. cupboard pickup, girl-to-girl swap">
  <button class="btn" onclick="addTransfer()">Save transfer</button>
  </div>`:`<div class="card"><h2>Record a transfer</h2><p class="muted">Sign in with either participating Girl Scout's PIN to record a girl-to-girl transfer.</p><button class="btn" onclick="toggleGirlLogin()">Family sign in</button></div>`;
  return `${form}<div class="card"><h2>Transfer history</h2><table><tr><th>Date</th><th>Move</th><th>Boxes</th><th>Note</th><th></th></tr>${list||'<tr><td colspan=5 class="muted">No transfers yet.</td></tr>'}</table></div>`;
}
function addTransfer(){
  const from=document.getElementById('tFrom').value, to=document.getElementById('tTo').value;
  const cookie=document.getElementById('tCookie').value, qty=+document.getElementById('tQty').value;
  const date=document.getElementById('tDate').value, note=document.getElementById('tNote').value;
  if(!qty||qty<=0){alert('Enter a number of boxes greater than 0.');return}
  if(from===to){alert('From and To must be different.');return}
  if(!coord&&(from==='TROOP'||to==='TROOP')){alert('Only the coordinator can record troop cupboard transfers.');return}
  if(!coord&&(!girlUserId||(from!==girlUserId&&to!==girlUserId))){alert('One side of the transfer must be your signed-in Girl Scout.');return}
  if(from==='TROOP'){state.troopInv[cookie]=(state.troopInv[cookie]||0)-qty}
  else{state.girlInv[from]=state.girlInv[from]||{inv:{},paid:0}; state.girlInv[from].inv[cookie]=(state.girlInv[from].inv[cookie]||0)-qty}
  if(to==='TROOP'){state.troopInv[cookie]=(state.troopInv[cookie]||0)+qty}
  else{state.girlInv[to]=state.girlInv[to]||{inv:{},paid:0}; state.girlInv[to].inv[cookie]=(state.girlInv[to].inv[cookie]||0)+qty}
  state.transfers.push({id:uid(),date,from,to,cookie,qty,note,createdByGirlId:coord?null:girlUserId});
  save(); render();
}
function delTransfer(id){
  const t=state.transfers.find(x=>x.id===id); if(!t)return;
  if(!coord&&t.createdByGirlId!==girlUserId)return;
  if(!confirm('Delete this transfer? This will also undo its inventory change.'))return;
  if(t.from==='TROOP'){state.troopInv[t.cookie]=(state.troopInv[t.cookie]||0)+t.qty} else if(state.girlInv[t.from]){state.girlInv[t.from].inv[t.cookie]=(state.girlInv[t.from].inv[t.cookie]||0)+t.qty}
  if(t.to==='TROOP'){state.troopInv[t.cookie]=(state.troopInv[t.cookie]||0)-t.qty} else if(state.girlInv[t.to]){state.girlInv[t.to].inv[t.cookie]=(state.girlInv[t.to].inv[t.cookie]||0)-t.qty}
  if(t.requestId&&t.fulfillmentId){const req=(state.transferRequests||[]).find(r=>r.id===t.requestId);if(req)req.fulfillments=(req.fulfillments||[]).filter(f=>f.id!==t.fulfillmentId);}
  state.transfers=state.transfers.filter(x=>x.id!==id);
  save(); render();
}

function requestRemaining(r){return Math.max(0,(+r.qty||0)-(r.fulfillments||[]).reduce((s,f)=>s+(+f.qty||0),0))}
function renderRequests(){
  const cookieOpts=state.cookies.map(c=>`<option value="${c.key}">${c.name}</option>`).join('');
  const girlOpts=(coord?state.girls:state.girls.filter(g=>g.id===girlUserId)).map(g=>`<option value="${g.id}">${g.name}</option>`).join('');
  const createForm=coord||girlUserId?`<div class="card"><h2>Post a transfer request</h2><p class="muted">Ask for boxes you need, or offer boxes you can give. Other families can fulfill all or part of the request.</p>
    <label>Girl Scout</label><select id="qGirl">${girlOpts}</select>
    <div class="grid2"><div><label>Request type</label><select id="qType"><option value="need">I need / want to take</option><option value="give">I can give</option></select></div><div><label>Date</label><input type="date" id="qDate" value="${new Date().toISOString().slice(0,10)}"></div></div>
    <div class="grid2"><div><label>Cookie</label><select id="qCookie">${cookieOpts}</select></div><div><label>Total boxes</label><input type="number" min="1" id="qQty"></div></div>
    <label>Note</label><input id="qNote" placeholder="optional details"><button class="btn" onclick="addRequest()">Post request</button></div>`:`<div class="card"><h2>Post a transfer request</h2><p class="muted">Sign in with your Girl Scout's PIN to post or fulfill requests.</p><button class="btn" onclick="toggleGirlLogin()">Family sign in</button></div>`;
  const cards=[...(state.transferRequests||[])].reverse().map(r=>{
    const remaining=requestRemaining(r), cookie=state.cookies.find(c=>c.key===r.cookie)?.name||r.cookie;
    const actorOpts=coord?'<option value="TROOP">Troop cupboard</option>'+state.girls.map(g=>`<option value="${g.id}">${g.name}</option>`).join(''):girlUserId?`<option value="${girlUserId}">${girlName(girlUserId)}</option>`:'';
    const history=(r.fulfillments||[]).map(f=>`${girlName(f.actorId)} ${r.type==='need'?'gave':'received'} ${f.qty}`).join(' · ');
    const canDelete=(coord||r.requesterId===girlUserId)&&!(r.fulfillments||[]).length;
    const fulfill=(coord||girlUserId)&&remaining>0?`<div class="grid2"><div><label>${r.type==='need'?'Fulfill from':'Give to'}</label><select id="qActor_${r.id}">${actorOpts}</select></div><div><label>Boxes to fulfill</label><input type="number" min="1" max="${remaining}" id="qFill_${r.id}" placeholder="up to ${remaining}"></div></div><button class="btn" onclick="fulfillRequest('${r.id}')">Fulfill request</button>`:'';
    return `<div class="card"><h2>${r.type==='need'?'🔎 Needs':'🎁 Can give'}: ${cookie}</h2><p><b>${girlName(r.requesterId)}</b> requested ${r.qty} box(es) on ${r.date}. <b>${remaining} remaining.</b></p>${r.note?`<p class="small">${r.note}</p>`:''}${history?`<p class="muted">Fulfilled so far: ${history}</p>`:''}${fulfill}${canDelete?` <button class="btn danger" onclick="delRequest('${r.id}')">Delete request</button>`:''}${remaining===0?'<span class="badge">Fulfilled</span>':''}</div>`;
  }).join('');
  return `${createForm}<h2>Open and fulfilled requests</h2>${cards||'<div class="card"><p class="muted">No transfer requests yet.</p></div>'}`;
}
function addRequest(){
  const requesterId=document.getElementById('qGirl').value,type=document.getElementById('qType').value,date=document.getElementById('qDate').value,cookie=document.getElementById('qCookie').value,qty=+document.getElementById('qQty').value,note=document.getElementById('qNote').value.trim();
  if(!coord&&requesterId!==girlUserId)return;
  if(!qty||qty<1){alert('Enter at least one box.');return}
  state.transferRequests=state.transferRequests||[];state.transferRequests.push({id:uid(),requesterId,type,date,cookie,qty,note,fulfillments:[]});save();render();
}
function fulfillRequest(id){
  const r=(state.transferRequests||[]).find(x=>x.id===id);if(!r)return;
  const actorId=document.getElementById('qActor_'+id).value,qty=+document.getElementById('qFill_'+id).value,remaining=requestRemaining(r);
  if(!qty||qty<1||qty>remaining){alert('Enter a quantity from 1 to '+remaining+'.');return}
  if(!coord&&actorId!==girlUserId)return;
  if(!coord&&actorId==='TROOP'){alert('Only the coordinator can use troop cupboard inventory.');return}
  const from=r.type==='need'?actorId:r.requesterId,to=r.type==='need'?r.requesterId:actorId;
  if(from===to){alert('Choose a different Girl Scout to fulfill this request.');return}
  const available=from==='TROOP'?(state.troopInv[r.cookie]||0):(state.girlInv[from]?.inv?.[r.cookie]||0);
  if(available<qty&&!confirm(girlName(from)+' currently shows only '+available+' box(es). Record this transfer anyway?'))return;
  if(from==='TROOP')state.troopInv[r.cookie]=(state.troopInv[r.cookie]||0)-qty;else{state.girlInv[from]=state.girlInv[from]||{inv:{},paid:0};state.girlInv[from].inv[r.cookie]=(state.girlInv[from].inv[r.cookie]||0)-qty}
  if(to==='TROOP')state.troopInv[r.cookie]=(state.troopInv[r.cookie]||0)+qty;else{state.girlInv[to]=state.girlInv[to]||{inv:{},paid:0};state.girlInv[to].inv[r.cookie]=(state.girlInv[to].inv[r.cookie]||0)+qty}
  const fulfillmentId=uid(),date=new Date().toISOString().slice(0,10);r.fulfillments=r.fulfillments||[];r.fulfillments.push({id:fulfillmentId,actorId,qty,date});
  state.transfers.push({id:uid(),date,from,to,cookie:r.cookie,qty,note:'Transfer request fulfillment',createdByGirlId:coord?null:girlUserId,requestId:r.id,fulfillmentId});save();render();
}
function delRequest(id){
  const r=(state.transferRequests||[]).find(x=>x.id===id);if(!r)return;
  if(!coord&&r.requesterId!==girlUserId)return;
  if((r.fulfillments||[]).length){alert('A partially fulfilled request cannot be deleted. Delete its fulfillment transfers first.');return}
  if(!confirm('Delete this transfer request?'))return;state.transferRequests=state.transferRequests.filter(x=>x.id!==id);save();render();
}

function paymentMethodLabel(method){return method==='cash'?'Cash':method==='zelle-venmo'?'Zelle/Venmo':'Other'}

function addPayment(){
  const girlId=document.getElementById('pGirl').value,date=document.getElementById('pDate').value,amount=+document.getElementById('pAmount').value,method=document.getElementById('pMethod').value,notes=document.getElementById('pNotes').value.trim();

  state.payments=state.payments||[];state.payments.push({id:uid(),girlId,date,amount,method,notes,createdByGirlId:coord?null:girlUserId});save();render();
}
function delPayment(id){
  const p=(state.payments||[]).find(x=>x.id===id);if(!p)return;
  if(!coord&&p.createdByGirlId!==girlUserId)return;

}

function addBooth(){
  const date=document.getElementById('bDate').value, time=document.getElementById('bTime').value, location=document.getElementById('bLoc').value;
  if(!location){alert('Enter a booth location.');return}
  const girls=[...document.querySelectorAll('.boothGirlChk:checked')].map(x=>x.value);

  document.querySelectorAll('.boothCookieQty').forEach(el=>{const q=+el.value||0; if(q>0){sales[el.dataset.key]=q; state.troopInv[el.dataset.key]=(state.troopInv[el.dataset.key]||0)-q;}});
  const cash=+document.getElementById('bCash').value||0, digital=+document.getElementById('bDigital').value||0, donations=+document.getElementById('bDon').value||0, notes=document.getElementById('bNotes').value;
  state.booths.push({id:uid(),date,time,location,girls,sales,cash,digital,donations,notes});
  save(); render();
}
function delBooth(id){
  if(!coord)return;
  const b=state.booths.find(x=>x.id===id); if(!b)return;
  if(!confirm('Delete this booth report? This will put its sold boxes back into troop inventory.'))return;
  Object.entries(b.sales).forEach(([k,q])=>{state.troopInv[k]=(state.troopInv[k]||0)+q});
  state.booths=state.booths.filter(x=>x.id!==id);
  save(); render();
}

function saveRosterSettings(){
  state.girlPins=state.girlPins||{};
  for(const g of state.girls){
    const pin=document.getElementById('pin_'+g.id).value.trim();
    if(pin&&!/^\d{4,8}$/.test(pin)){alert(g.name+' needs a 4–8 digit PIN, or leave it blank.');return}
    if(pin)state.girlPins[g.id]=pin;else delete state.girlPins[g.id];
    state.girlInv[g.id]=state.girlInv[g.id]||{inv:{},paid:0};state.girlInv[g.id].paid=+document.getElementById('paid_'+g.id).value||0;
  }
  save();render();
}
function addGirl(){const n=document.getElementById('newGirl').value.trim(); if(!n)return; const id=uid(); state.girls.push({id,name:n}); state.girlInv[id]={inv:{},paid:0}; save(); render();}
function removeGirl(id){if(!confirm('Remove this girl? Her inventory, PIN, and payment record will be deleted.'))return; state.girls=state.girls.filter(g=>g.id!==id); delete state.girlInv[id];if(state.girlPins)delete state.girlPins[id];save();render();}
function savePrices(){state.cookies.forEach(c=>{c.price=+document.getElementById('price_'+c.key).value||c.price}); save(); render();}
function changePw(){const p=document.getElementById('newPw').value.trim(); if(!p){alert('Enter a new password.');return} state.pw=p; save(); alert('Password updated.');}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='troop2360-cookies-backup.json'; a.click();
}
function importData(){
  const f=document.getElementById('importFile').files[0]; if(!f){alert('Choose a file first.');return}
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result); if(!d.girls||!d.cookies){alert('That file is not a valid backup.');return} state=d; save(); render(); alert('Data imported.');}catch(e){alert('Could not read that file.')}};
  r.readAsText(f);
}
startApp();
</script>
</body>
</html>
