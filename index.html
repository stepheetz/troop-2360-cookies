<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Troop 2360 Cookie Tracker</title>
<style>
:root{--bg:#fff8ee;--panel:rgba(255,255,255,.94);--ink:#2c2416;--sub:#6b5f4d;--line:#eadfcf;--brown:#7a4a2c;--green:#00834f;--accent:#f6b84a;--danger:#a53f3f;--radius:14px}
:root:not([data-theme="light"]){@media(prefers-color-scheme:dark){--bg:#1c1810;--panel:#262019;--ink:#f0ead9;--sub:#b8ac93;--line:#3a3226;--brown:#c98a5e;--green:#5fae82;--accent:#e0a752}}
:root[data-theme="dark"]{--bg:#1c1810;--panel:#262019;--ink:#f0ead9;--sub:#b8ac93;--line:#3a3226;--brown:#c98a5e;--green:#5fae82;--accent:#e0a752}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(circle at 12% 18%,rgba(92,192,113,.30) 0 90px,transparent 92px),radial-gradient(circle at 88% 12%,rgba(246,184,74,.32) 0 120px,transparent 122px),radial-gradient(circle at 82% 78%,rgba(131,96,179,.22) 0 145px,transparent 147px),radial-gradient(circle at 14% 84%,rgba(228,98,106,.20) 0 125px,transparent 127px),linear-gradient(135deg,#fff6d9 0%,#ecfaef 48%,#fff0f3 100%);background-attachment:fixed;color:var(--ink);font-family:Georgia,'Iowan Old Style',serif;line-height:1.4;min-height:100vh}
header{background:linear-gradient(110deg,#00834f 0%,#00a56a 55%,#6f3f8f 100%);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;box-shadow:0 3px 12px rgba(44,36,22,.18)}
header h1{margin:0;font-size:1.25rem;font-weight:600}
header .sub{font-family:Verdana,sans-serif;font-size:.75rem;opacity:.85}
#coordBtn,#girlBtn{font-family:Verdana,sans-serif;font-size:.8rem;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer}
#coordBtn.on{background:var(--accent);border-color:var(--accent);color:#2c2416}
.header-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
#girlBtn.on{background:#fff;color:#17613f;border-color:#fff}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:9px 12px;background:rgba(255,255,255,.91);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
nav button{font-family:Verdana,sans-serif;font-size:.8rem;font-weight:700;padding:8px 13px;border:1px solid #b8cbbf;background:#eef8f1;color:#175f3d;border-radius:20px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
nav button:hover{background:#dff2e5;border-color:#78a98b}
nav button.active{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 2px 7px rgba(0,131,79,.28)}
main{max-width:920px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.82);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 5px 18px rgba(73,54,28,.10)}
h2{margin-top:0;font-size:1.05rem}
table{width:100%;border-collapse:collapse;font-family:Verdana,sans-serif;font-size:.82rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:600}
tr:last-child td{border-bottom:none}
.tot{font-weight:700}
label{display:block;font-family:Verdana,sans-serif;font-size:.75rem;color:var(--sub);margin:8px 0 3px}
input,select,textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-family:Verdana,sans-serif;font-size:.85rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font-family:Verdana,sans-serif;font-size:.82rem;padding:8px 14px;border:none;border-radius:7px;background:var(--green);color:#fff;cursor:pointer;margin-top:10px}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger)}
.badge{display:inline-block;font-family:Verdana,sans-serif;font-size:.7rem;background:var(--accent);color:#2c2416;padding:2px 7px;border-radius:10px;margin-left:6px}
.chk{display:flex;align-items:center;gap:6px;font-family:Verdana,sans-serif;font-size:.8rem;margin:4px 0}
.chk input{width:auto}
.muted{color:var(--sub);font-family:Verdana,sans-serif;font-size:.78rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20}
.modal{background:var(--panel);padding:20px;border-radius:12px;max-width:320px;width:90%}
.row-actions button{font-size:.72rem;padding:3px 8px;margin-right:4px}
.small{font-size:.75rem;color:var(--sub)}
::placeholder{color:var(--sub);opacity:.6}
#status{font-family:Verdana,sans-serif;font-size:.7rem;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.15)}
#status.live{background:#3a7a52}
#status.err{background:var(--danger)}
.cookie-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 12px}.cookie-line{display:flex;align-items:center;justify-content:space-between;gap:6px;font:12px Verdana,sans-serif;padding:2px 0}.cookie-line label{margin:0;flex:1;font-size:11px}.cookie-line input{width:65px;min-width:55px;padding:4px 5px}.cookie-grid .grid2{display:contents}@media(max-width:480px){.cookie-grid{grid-template-columns:1fr 1fr}.cookie-line{flex-wrap:wrap}.cookie-line input{width:56px}}.warn{color:#a53f3f;font-weight:bold}.order-check{font-size:1.1rem}

/* 2026 timeline, resource library and compact booth history */
.dash-timeline{grid-column:1;grid-row:1}.dash-stats{grid-column:2;grid-row:1}
@media(max-width:1100px){.dash-timeline,.dash-stats{grid-column:auto;grid-row:auto}}
.role-entry{padding:9px 0;border-bottom:1px solid var(--line)}
.role-entry:last-child{border-bottom:0}
.role-entry h3{font:700 13px Verdana,sans-serif;color:var(--green);margin:0 0 5px}
.role-entry p{font:12px/1.5 Verdana,sans-serif;margin:0;color:var(--ink)}
.dashboard-layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(420px,1.7fr);gap:14px;align-items:start}
.dashboard-layout .card{margin-top:0;margin-bottom:14px}
.dash-stats{min-width:0}
.timeline-list{max-height:860px;overflow-y:auto;padding-right:6px}
.timeline-item{display:grid;grid-template-columns:115px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font:12px/1.4 Verdana,sans-serif}
.timeline-item strong{color:var(--green)}
.resources-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.resource-link{display:flex;flex-direction:column;gap:5px;border:1px solid var(--line);border-radius:8px;padding:10px;text-decoration:none;color:var(--ink);overflow-wrap:anywhere;font:12px/1.4 Verdana,sans-serif}
.resource-link:hover{border-color:var(--green);background:rgba(0,131,79,.06)}
.resource-link small{color:var(--sub)}
.past-booths-heading,.requests-heading{color:var(--ink)!important;font-weight:700}.role-entry ul{margin:4px 0 10px;padding-left:18px}.role-entry li{margin:2px 0;font-size:.81rem;line-height:1.35}
.table-scroll{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.booth-history{width:max-content;min-width:100%;border-collapse:collapse;font:11px/1.4 Verdana,sans-serif}
.booth-history th,.booth-history td{padding:7px 8px;border:1px solid var(--line);vertical-align:top;white-space:nowrap}
.booth-history th{background:var(--panel);color:var(--ink);font-weight:700;position:sticky;top:0}
.booth-history td.num{text-align:right;font-variant-numeric:tabular-nums}
.booth-history td:last-child{white-space:normal;min-width:130px}
.booth-history .btn{margin:2px;padding:4px 7px}
@media(max-width:1100px){.dashboard-layout{grid-template-columns:1fr}.timeline-list{max-height:400px}.resources-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div><h1>🍪 Troop 2360 Cookie Tracker</h1><div class="sub">2027 Cookie Season · Girl inventory only <span id="status">Connecting…</span></div></div>
  <div class="header-actions"><button id="girlBtn" onclick="toggleGirlLogin()">Family sign in</button><button id="coordBtn" onclick="toggleCoord()">Coordinator: Locked</button></div>
</header>
<nav id="tabs"></nav>
<main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ====== PASTE YOUR FIREBASE CONFIG HERE (see setup instructions) ====== */
const firebaseConfig = {
  apiKey: "AIzaSyDQ0ZGWjHcUZgMWaS47AKLrCywXCDWHTqM",
  authDomain: "troop-2360-cookies.firebaseapp.com",
  projectId: "troop-2360-cookies",
  storageBucket: "troop-2360-cookies.firebasestorage.app",
  messagingSenderId: "189199563563",
  appId: "1:189199563563:web:a6414a9e527726345aa36e",
  measurementId: "G-BW10NGSLQQ"
};
/* ======================================================================= */

const COOKIES=[
 {key:'adv',name:'Adventurefuls',price:6},{key:'exp',name:'Exploremores',price:6},
 {key:'lem',name:'Lemonades',price:6},{key:'tre',name:'Trefoils',price:6},
 {key:'tm',name:'Thin Mints',price:6},{key:'pbp',name:'Peanut Butter Patties',price:6},
 {key:'cdl',name:'Caramel deLites',price:6},{key:'pbs',name:'Peanut Butter Sandwich',price:6},
 {key:'gf',name:'Caramel Chocolate Chip (GF)',price:7},
 {key:'spk',name:'Sparkables',price:6},{key:'pp',name:'PatchPals',price:6},
 {key:'share',name:'Cookie Share (Donation)',price:6}];
const GIRL_NAMES=['Amelia','Carissa','Cassie','Coco','Emersyn','Evelyn','Katherine','Keira','Madison','Morgan','Makenna','Molly','Sophia'];
function uid(){return Math.random().toString(36).slice(2,10)}
function defaultState(){
  let girls=GIRL_NAMES.map(n=>({id:uid(),name:n}));
  let girlInv={}; girls.forEach(g=>girlInv[g.id]={inv:{},paid:0});
  return {girls,cookies:COOKIES,troopInv:{},girlInv,girlPins:{},cupboardOrders:[],participation:{},boothGoal:10,girlSales:[],transfers:[],transferRequests:[],inventoryReceipts:[],payments:[],booths:[],online:[],pw:'cookies2026'};
}
let state=null, coord=false, girlUserId=sessionStorage.getItem('girlUserId')||null, db=null, docRef=null, ready=false;
function setStatus(cls,text){const el=document.getElementById('status'); el.className=cls; el.textContent=text;}
function save(){
  if(!docRef)return;
  docRef.set(state).then(()=>setStatus('live','Live')).catch(e=>{setStatus('err','Not saved — check connection'); console.error(e);});
}
function startApp(){
  if(firebaseConfig.apiKey==='YOUR_API_KEY'){
    document.getElementById('app').innerHTML=`<div class="card"><h2>Almost there</h2><p>This copy of the tracker needs a free Firebase project connected before it can sync. Open the file's code and paste your <code>firebaseConfig</code> values in near the top where it says "PASTE YOUR FIREBASE CONFIG HERE".</p></div>`;
    setStatus('err','Not connected');
    return;
  }
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="${activeTab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  document.getElementById('app').innerHTML='<div class="card">Connecting to the shared troop database…</div>';
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();
  docRef=db.collection('troop2360').doc('data');
  docRef.onSnapshot(snap=>{
    if(snap.exists){state=Object.assign(defaultState(),snap.data()); if(!state.cookies||!state.cookies.length)state.cookies=COOKIES;}
    else{state=defaultState(); docRef.set(state);}
    if(!state.cupboardOrders)state.cupboardOrders=[];if(!state.participation)state.participation={};
    if(girlUserId&&!state.girls.some(g=>g.id===girlUserId)){girlUserId=null;sessionStorage.removeItem('girlUserId');}
    ready=true; setStatus('live','Live'); render();
  },err=>{setStatus('err','Connection error — check your Firebase config & rules'); console.error(err);});
}
function zeroMap(){let m={}; state.cookies.forEach(c=>m[c.key]=0); return m}
function invOf(obj){return Object.assign(zeroMap(),obj||{})}
function money(n){return '$'+(Math.round(n*100)/100).toFixed(2)}
function girlName(id){if(id==='TROOP')return 'Troop';let g=state.girls.find(x=>x.id===id);return g?g.name:'(removed)'}

function toggleCoord(){
  if(coord){coord=false;render();return}
  let p=prompt('Coordinator password:');
  if(p===null)return;
  if(p===state.pw){coord=true;render();}
  else alert('Incorrect password.');
}

function toggleGirlLogin(){
  if(girlUserId){girlUserId=null;sessionStorage.removeItem('girlUserId');render();return}
  const opts=state.girls.map(g=>`<option value="${g.id}">${g.name}</option>`).join('');
  document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="girlLogin"><div class="modal"><h2>Family sign in</h2><label>Girl Scout</label><select id="loginGirl">${opts}</select><label>PIN</label><input id="loginPin" type="password" inputmode="numeric" maxlength="8" placeholder="Enter PIN" onkeydown="if(event.key==='Enter')doGirlLogin()"><button class="btn" onclick="doGirlLogin()">Sign in</button> <button class="btn sec" onclick="closeGirlLogin()">Cancel</button><p class="muted">Ask the cookie coordinator if you need your PIN.</p></div></div>`);
  setTimeout(()=>document.getElementById('loginPin')?.focus(),0);
}
function closeGirlLogin(){document.getElementById('girlLogin')?.remove()}
function doGirlLogin(){
  const id=document.getElementById('loginGirl').value, pin=document.getElementById('loginPin').value.trim();
  if(!state.girlPins?.[id]){alert('A PIN has not been assigned yet. Ask the coordinator to create one.');return}
  if(pin!==String(state.girlPins[id])){alert('Incorrect PIN.');return}
  girlUserId=id;sessionStorage.setItem('girlUserId',id);closeGirlLogin();render();
}

const RESOURCE_FILES=[{"name": "116 BSP2026.pdf", "url": "Resources/116%20BSP2026.pdf", "kind": "PDF"}, {"name": "2025-Troop-Balance-Summary-pdf.pdf", "url": "Resources/2025-Troop-Balance-Summary-pdf.pdf", "kind": "PDF"}, {"name": "2026 Girl Scout Cookie Sales - TEMPLATE.xlsx", "url": "Resources/2026%20Girl%20Scout%20Cookie%20Sales%20-%20TEMPLATE.xlsx", "kind": "XLSX"}, {"name": "2026-Cookie-Family-Guide_Final.pdf", "url": "Resources/2026-Cookie-Family-Guide_Final.pdf", "kind": "PDF"}, {"name": "2026_BFF_AllergenGuide.pdf", "url": "Resources/2026_BFF_AllergenGuide.pdf", "kind": "PDF"}, {"name": "2026_BFF_CookieLineUp_PRINT.pdf", "url": "Resources/2026_BFF_CookieLineUp_PRINT.pdf", "kind": "PDF"}, {"name": "2026_BFF_CookieLineUp_PRINT.pdf-2.pdf", "url": "Resources/2026_BFF_CookieLineUp_PRINT.pdf-2.pdf", "kind": "PDF"}, {"name": "2026_Cookie-Program-Girl-Rewards.pdf", "url": "Resources/2026_Cookie-Program-Girl-Rewards.pdf", "kind": "PDF"}, {"name": "ABC-Cookie-Booth-Tally-Sheet-2026.pdf", "url": "Resources/ABC-Cookie-Booth-Tally-Sheet-2026.pdf", "kind": "PDF"}, {"name": "Booth Sales Best Practices 2026 12-26-25.pdf", "url": "Resources/Booth%20Sales%20Best%20Practices%202026%2012-26-25.pdf", "kind": "PDF"}, {"name": "BoothTimesReport.pdf", "url": "Resources/BoothTimesReport.pdf", "kind": "PDF"}, {"name": "cookie dos_ and don_ts.pdf", "url": "Resources/cookie%20dos_%20and%20don_ts.pdf", "kind": "PDF"}, {"name": "cookie line up prices.pdf", "url": "Resources/cookie%20line%20up%20prices.pdf", "kind": "PDF"}, {"name": "Cookie-Booth-Sale-Guidelines.pdf", "url": "Resources/Cookie-Booth-Sale-Guidelines.pdf", "kind": "PDF"}, {"name": "Cookie-Share-Receipts.pdf", "url": "Resources/Cookie-Share-Receipts.pdf", "kind": "PDF"}, {"name": "Damaged-Product-Report-Cookies-2025.pdf", "url": "Resources/Damaged-Product-Report-Cookies-2025.pdf", "kind": "PDF"}, {"name": "Donate to Troops.png", "url": "Resources/Donate%20to%20Troops.png", "kind": "PNG"}, {"name": "Forms of Payment.png", "url": "Resources/Forms%20of%20Payment.png", "kind": "PNG"}, {"name": "How-Many-GS-Cookies.pdf", "url": "Resources/How-Many-GS-Cookies.pdf", "kind": "PDF"}, {"name": "Irvine-Business-Lic.-Exp.-02.28.26.pdf", "url": "Resources/Irvine-Business-Lic.-Exp.-02.28.26.pdf", "kind": "PDF"}, {"name": "Irvine-Company-Entry-Permit_2026.pdf", "url": "Resources/Irvine-Company-Entry-Permit_2026.pdf", "kind": "PDF"}, {"name": "Prop_65_Warning_Sign.pdf", "url": "Resources/Prop_65_Warning_Sign.pdf", "kind": "PDF"}, {"name": "Troop-Initial-Order-Bonus_2026.pdf", "url": "Resources/Troop-Initial-Order-Bonus_2026.pdf", "kind": "PDF"}, {"name": "Troop-Plan-Book-2026_FINAL_Posted.pdf", "url": "Resources/Troop-Plan-Book-2026_FINAL_Posted.pdf", "kind": "PDF"}, {"name": "Tustin-Business-License-2026.pdf", "url": "Resources/Tustin-Business-License-2026.pdf", "kind": "PDF"}];
const TIMELINE_2026=[["Nov 24–Jan 14", "Preparation, training, family meeting, booth lottery"], ["Dec 15", "Initial troop order deadline"], ["Dec 22–31", "Cookie materials mailed"], ["Dec 29", "Digital Cookie volunteer registration"], ["Jan 2", "Digital Cookie girl registration"], ["Jan 6", "Pre-orders and online sales begin"], ["Jan 8", "Troop banking information"], ["Jan 11", "Cookie kickoff"], ["Jan 20", "Booked booth sales report"], ["Jan 23–25", "Initial order pickup and distribution"], ["Jan 24", "Mega Delivery"], ["Jan 25", "In-hand sales and deliveries begin"], ["Jan 27–28", "First-come booth reservations"], ["Jan 29", "Cookie cupboards open"], ["Feb 1–Mar 15", "Collect and reconcile girl payments"], ["Feb 6–Mar 15", "Booth sales"], ["Feb 26", "Cookie swap site available"], ["Mar 15", "Cookie program ends / collect final balances"], ["Mar 15–18", "End-of-sale processing"], ["Mar 17", "Final deposit / payment adjustment deadline"], ["Mar 18", "Final troop report due"], ["Mar 19", "Final ACH debit begins"], ["May 1–15", "Girl rewards pickup"], ["May 22", "Final reward adjustments"]];
const TABS=[['dash','Dashboard'],['team','Cookie Team'],['mine','My Records'],['orders','Cupboard Orders'],['transfers','Transfers'],['requests','Transfer Requests'],['payments','Payments'],['booths','Booth Sales'],['online','Online Sales'],['resources','Resources'],['coord','Coordinator']];
let activeTab='dash', selectedGirlId=null, editingReceiptId=null;
function setTab(t){activeTab=t;render();}
function setMineGirl(id){selectedGirlId=id;render();}

function render(){
  if(!ready)return;
  document.getElementById('coordBtn').textContent='Coordinator: '+(coord?'Unlocked':'Locked');
  document.getElementById('coordBtn').className=coord?'on':'';
  const girlBtn=document.getElementById('girlBtn'), signedGirl=state.girls.find(g=>g.id===girlUserId);
  girlBtn.textContent=signedGirl?'Signed in: '+signedGirl.name:'Family sign in';
  girlBtn.className=signedGirl?'on':'';
  const nav=document.getElementById('tabs');
  nav.innerHTML=TABS.map(([k,l])=>`<button class="${activeTab===k?'active':''}" onclick="setTab('${k}')">${k==='mine'&&signedGirl?signedGirl.name+'\'s Records':l}</button>`).join('');
  document.getElementById('app').innerHTML=({dash:renderDash,team:renderTeam,mine:renderMine,orders:renderOrders,transfers:renderTransfers,requests:renderRequests,payments:renderPayments,booths:renderBooths,online:renderOnline,resources:renderResources,coord:renderCoord}[activeTab])();
}

function totalGirlInv(){let t=zeroMap(); state.girls.forEach(g=>{let inv=invOf(state.girlInv[g.id]?.inv);state.cookies.forEach(c=>t[c.key]+=inv[c.key]||0)}); return t}
function totalGirlSalesByType(){let t=zeroMap();(state.girlSales||[]).forEach(o=>state.cookies.forEach(c=>t[c.key]+=o.items?.[c.key]||0));return t}
function totalBoothsByType(){let t=zeroMap(); state.booths.forEach(b=>state.cookies.forEach(c=>t[c.key]+=b.sales[c.key]||0)); return t}
function totalOnlineByType(){let t=zeroMap(); state.online.forEach(o=>state.cookies.forEach(c=>t[c.key]+=o.items[c.key]||0)); return t}

function escapeText(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function renderResources(){return `<div class="card"><h2>📚 Resources</h2><p class="muted">2026 reference materials. Replace outdated files with current council documents before the 2027 season. Links work when the Resources folder is uploaded alongside index.html.</p><div class="resources-grid">${RESOURCE_FILES.map(f=>`<a class="resource-link" href="${f.url}" target="_blank" rel="noopener"><span>📄 ${escapeText(f.name)}</span><small>${f.kind} · 2026 reference ↗</small></a>`).join('')}</div></div>`;}
function renderDash(){
  const girlInv=totalGirlInv(), girlSales=totalGirlSalesByType(), booth=totalBoothsByType(), online=totalOnlineByType();
  const boothCash=state.booths.reduce((s,b)=>s+(+b.cash||0),0), boothDig=state.booths.reduce((s,b)=>s+(+b.digital||0),0), boothDon=state.booths.reduce((s,b)=>s+(+b.donations||0),0);
  const onlineAmt=state.online.reduce((s,o)=>s+(+o.amount||0),0);
  const customerPaid=(state.girlSales||[]).reduce((s,o)=>s+(+o.amountPaid||0),0);
  let rows=state.cookies.map(c=>{
    const troopQ=0, girlQ=girlInv[c.key]||0, directQ=girlSales[c.key]||0, boothQ=booth[c.key]||0, onlineQ=online[c.key]||0;
    return `<tr><td>${c.name}</td><td>${girlQ}</td><td>${directQ}</td><td>${boothQ}</td><td>${onlineQ}</td></tr>`;
  }).join('');
  return `<div class="dashboard-layout"><section class="dash-timeline card"><h2>📅 Program timeline</h2><p class="muted">2026 dates from Troop Plan Book, pp. 4–5. Reference only; update for 2027 when council confirms dates.</p><div class="timeline-list">${TIMELINE_2026.map(([date,event])=>`<div class="timeline-item"><strong>${date}</strong><span>${event}</span></div>`).join('')}</div></section><section class="dash-stats"><div class="card"><h2>Troop overview</h2>
  <table><tr><th>Cookie</th><th>With girls</th><th>Customer sales</th><th>Sold at booths</th><th>Sold online</th></tr>${rows}</table>
  </div>
  <div class="card"><h2>Money raised so far</h2>

  const r=(state.transferRequests||[]).find(x=>x.id===id);if(!r)return;
  const actorId=document.getElementById('qActor_'+id).value,qty=+document.getElementById('qFill_'+id).value,remaining=requestRemaining(r);
  if(!qty||qty<1||qty>remaining){alert('Enter a quantity from 1 to '+remaining+'.');return}
  if(!coord&&actorId!==girlUserId)return;
  if(!coord&&actorId==='TROOP'){alert('Only the coordinator can use troop cupboard inventory.');return}
  const from=r.type==='need'?actorId:r.requesterId,to=r.type==='need'?r.requesterId:actorId;
  if(from==='TROOP'||to==='TROOP'){alert('Troop inventory is retired.');return;}
  if(from===to){alert('Choose a different Girl Scout to fulfill this request.');return}
  const available=from==='TROOP'?(state.troopInv[r.cookie]||0):(state.girlInv[from]?.inv?.[r.cookie]||0);
  if(available<qty&&!confirm(girlName(from)+' currently shows only '+available+' box(es). Record this transfer anyway?'))return;
  if(from==='TROOP')state.troopInv[r.cookie]=(state.troopInv[r.cookie]||0)-qty;else{state.girlInv[from]=state.girlInv[from]||{inv:{},paid:0};state.girlInv[from].inv[r.cookie]=(state.girlInv[from].inv[r.cookie]||0)-qty}
  if(to==='TROOP')state.troopInv[r.cookie]=(state.troopInv[r.cookie]||0)+qty;else{state.girlInv[to]=state.girlInv[to]||{inv:{},paid:0};state.girlInv[to].inv[r.cookie]=(state.girlInv[to].inv[r.cookie]||0)+qty}
  const fulfillmentId=uid(),date=new Date().toISOString().slice(0,10);r.fulfillments=r.fulfillments||[];r.fulfillments.push({id:fulfillmentId,actorId,qty,date});
  state.transfers.push({id:uid(),date,from,to,cookie:r.cookie,qty,note:'Transfer request fulfillment',createdByGirlId:coord?null:girlUserId,requestId:r.id,fulfillmentId});save();render();
}
function delRequest(id){
  const r=(state.transferRequests||[]).find(x=>x.id===id);if(!r)return;

function addPayment(){
  const girlId=document.getElementById('pGirl').value,date=document.getElementById('pDate').value,amount=+document.getElementById('pAmount').value,method=document.getElementById('pMethod').value,notes=document.getElementById('pNotes').value.trim();

  state.girlInv[girlId]=state.girlInv[girlId]||{inv:{},paid:0};state.girlInv[girlId].paid=(+state.girlInv[girlId].paid||0)+amount;
  state.payments=state.payments||[];state.payments.push({id:uid(),girlId,date,amount,method,notes,createdByGirlId:coord?null:girlUserId});save();render();
}
function delPayment(id){
  const p=(state.payments||[]).find(x=>x.id===id);if(!p)return;
  if(!coord&&p.createdByGirlId!==girlUserId)return;
  if(!confirm('Delete this payment? It will be removed from the girl\'s total paid.'))return;
  if(state.girlInv[p.girlId])state.girlInv[p.girlId].paid=Math.max(0,(+state.girlInv[p.girlId].paid||0)-(+p.amount||0));
  state.payments=state.payments.filter(x=>x.id!==id);save();render();
}

function boothCreditForGirl(girl){
  return state.booths.reduce((t,b)=>{if(!b.girls?.includes(girl.name)||!b.girls.length)return t;const n=b.girls.length;t.booths++;t.boxes+=state.cookies.reduce((s,c)=>s+(+b.sales?.[c.key]||0),0)/n;t.amount+=((+b.cash||0)+(+b.digital||0)+(+b.donations||0))/n;return t;},{booths:0,boxes:0,amount:0});
}

function showBoothAllocation(){
 const girls=[...document.querySelectorAll('.boothGirlChk:checked')].map(e=>e.value);

function addBooth(){
  const date=document.getElementById('bDate').value, time=document.getElementById('bTime').value, location=document.getElementById('bLoc').value;
  if(!location){alert('Enter a booth location.');return}
  const girls=[...document.querySelectorAll('.boothGirlChk:checked')].map(x=>x.value);
  if(!girls.length){alert('Select at least one participating Girl Scout so the booth totals can be divided correctly.');return}
  const sales={};
  document.querySelectorAll('.boothCookieQty').forEach(el=>{const q=+el.value||0; if(q>0){sales[el.dataset.key]=q;}});
  const allocations={};document.querySelectorAll('.boothAlloc').forEach(el=>{const q=+el.value||0;if(q>0){allocations[el.dataset.girl]=allocations[el.dataset.girl]||{};allocations[el.dataset.girl][el.dataset.cookie]=q;}});
  if(!document.querySelectorAll('.boothAlloc').length)return alert('Click Set / refresh girl inventory allocations before submitting.');
  const discrepancies=[];for(const c of state.cookies){if(c.key==='share')continue;const assigned=Object.values(allocations).reduce((sum,a)=>sum+(a[c.key]||0),0);if(assigned!==(sales[c.key]||0))discrepancies.push(c.name+': sold '+(sales[c.key]||0)+', allocated '+assigned);}
  if(discrepancies.length&&!document.getElementById('bOverride').checked)return alert('Discrepancy detected:\n'+discrepancies.join('\n')+'\nCheck Override discrepancy to save with a warning.');
  for(const [id,items] of Object.entries(allocations))for(const [k,q] of Object.entries(items))if((state.girlInv[id]?.inv?.[k]||0)<q)return alert(girlName(id)+' has insufficient '+k+' inventory. Record cupboard pickups or transfers first.');
  for(const [id,items] of Object.entries(allocations))for(const [k,q] of Object.entries(items))state.girlInv[id].inv[k]-=q;
  const cash=+document.getElementById('bCash').value||0, digital=+document.getElementById('bDigital').value||0, donations=+document.getElementById('bDon').value||0, notes=document.getElementById('bNotes').value;
  state.booths.push({id:uid(),date,time,location,girls,sales,allocations,cash,digital,donations,notes,discrepancies,override:discrepancies.length>0});
  save(); render();
}
function editBooth(id){if(!coord)return;const b=state.booths.find(x=>x.id===id);if(!b)return;
 const date=prompt('Date',b.date);if(date===null)return;const location=prompt('Location',b.location);if(location===null)return;
 const salesText=prompt('Boxes sold, cookie-key:boxes comma separated',Object.entries(b.sales).map(([k,v])=>k+':'+v).join(', '));if(salesText===null)return;
 const sales={};for(const item of salesText.split(',')){if(!item.trim())continue;const [k,v]=item.trim().split(':');if(!state.cookies.some(c=>c.key===k)||!Number.isInteger(+v)||+v<0)return alert('Invalid cookie quantity.');if(+v)sales[k]=+v;}
 const cash=prompt('Cash collected',b.cash);if(cash===null)return;const digital=prompt('Digital/card collected',b.digital);if(digital===null)return;const donations=prompt('Donations',b.donations);if(donations===null)return;const notes=prompt('Notes',b.notes||'');if(notes===null)return;
 const discrepancies=state.cookies.filter(c=>c.key!=='share').map(c=>{const a=Object.values(b.allocations||{}).reduce((v,x)=>v+(+x[c.key]||0),0);return a!==(sales[c.key]||0)?c.name+': sold '+(sales[c.key]||0)+', allocated '+a:null}).filter(Boolean);
 if(discrepancies.length&&!confirm('This edit has a discrepancy. Save and flag?\n'+discrepancies.join('\n')))return;
 Object.assign(b,{date,location,sales,cash:+cash||0,digital:+digital||0,donations:+donations||0,notes,discrepancies,override:!!discrepancies.length});save();render();}
function delBooth(id){
  if(!coord)return;
  const b=state.booths.find(x=>x.id===id); if(!b)return;
  if(!confirm('Delete this booth report? This will restore physical boxes to the girls who supplied them.'))return;
  for(const [gid,items] of Object.entries(b.allocations||{}))for(const [k,q] of Object.entries(items)){if(state.girlInv[gid])state.girlInv[gid].inv[k]=(state.girlInv[gid].inv[k]||0)+q;}
  state.booths=state.booths.filter(x=>x.id!==id);
  save(); render();
}

function addOnline(){

function editOnline(id){const o=state.online.find(x=>x.id===id);if(!o||(!coord&&o.createdByGirlId!==girlUserId))return;
 const date=prompt('Date',o.date);if(date===null)return;const amount=prompt('Amount ($)',o.amount);if(amount===null)return;
 const itemsText=prompt('Cookie-key:boxes comma separated',Object.entries(o.items).map(([k,v])=>k+':'+v).join(', '));if(itemsText===null)return;
 const items={};for(const part of itemsText.split(',')){if(!part.trim())continue;const [k,v]=part.trim().split(':');if(!state.cookies.some(c=>c.key===k)||!Number.isInteger(+v)||+v<0)return alert('Invalid cookie quantity');if(+v)items[k]=+v;}
 const delivered=confirm('OK = girl delivery (deduct inventory). Cancel = shipped (no inventory deduction).');const note=prompt('Note',o.note||'');if(note===null)return;
 if(o.delivered)for(const [k,q] of Object.entries(o.items))state.girlInv[o.girlId].inv[k]=(state.girlInv[o.girlId].inv[k]||0)+q;
 if(delivered)for(const [k,q] of Object.entries(items))state.girlInv[o.girlId].inv[k]=(state.girlInv[o.girlId].inv[k]||0)-q;
 Object.assign(o,{date,amount:+amount||0,items,delivered,note});save();render();}
function delOnline(id){
  const o=state.online.find(x=>x.id===id); if(!o)return;

}

function saveRosterSettings(){
  state.girlPins=state.girlPins||{};
  for(const g of state.girls){
    const pin=document.getElementById('pin_'+g.id).value.trim();
    if(pin&&!/^\d{4,8}$/.test(pin)){alert(g.name+' needs a 4–8 digit PIN, or leave it blank.');return}
    if(pin)state.girlPins[g.id]=pin;else delete state.girlPins[g.id];
    state.girlInv[g.id]=state.girlInv[g.id]||{inv:{},paid:0};state.girlInv[g.id].paid=+document.getElementById('paid_'+g.id).value||0;
  }
  save();render();
}
function addGirl(){const n=document.getElementById('newGirl').value.trim(); if(!n)return; const id=uid(); state.girls.push({id,name:n}); state.girlInv[id]={inv:{},paid:0}; save(); render();}
function removeGirl(id){if(!confirm('Remove this girl? Her inventory, PIN, and payment record will be deleted.'))return; state.girls=state.girls.filter(g=>g.id!==id); delete state.girlInv[id];if(state.girlPins)delete state.girlPins[id];save();render();}
function savePrices(){state.cookies.forEach(c=>{c.price=+document.getElementById('price_'+c.key).value||c.price}); save(); render();}
function changePw(){const p=document.getElementById('newPw').value.trim(); if(!p){alert('Enter a new password.');return} state.pw=p; save(); alert('Password updated.');}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='troop2360-cookies-backup.json'; a.click();
}
function importData(){
  const f=document.getElementById('importFile').files[0]; if(!f){alert('Choose a file first.');return}
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result); if(!d.girls||!d.cookies){alert('That file is not a valid backup.');return} state=d; save(); render(); alert('Data imported.');}catch(e){alert('Could not read that file.')}};
  r.readAsText(f);
}
startApp();
</script>
</body>
</html>
